<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Author · Orionis</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="../">← Simulation demos</a><p class="eyebrow">Mission Author · benchmark</p><h1>Compose and review a mission</h1><p>Explore authored possibilities and their sources. This author view includes hidden Reality. Drafts require a Finalizer before Offworld play.</p></header>
